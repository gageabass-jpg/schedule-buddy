<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Nucleus Wagonwheel app icon: a red glass tile with the Nucleus block-knot mark. The mark's
       path is the one in shared-ui/src/brand/nucleusMark.tsx. Rendered to icon.png by build/make-icon.mjs. -->
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e4607a"/>
      <stop offset="0.45" stop-color="#c62845"/>
      <stop offset="1" stop-color="#4b1426"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2a0812" flood-opacity="0.55"/></filter>
  </defs>
  <!-- macOS tile: inset 100px, corner radius 22.5% of the tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#soft)"/>
  <rect x="100" y="100" width="824" height="412" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- the mark, at 55% of the tile -->
  <g transform="translate(286 286) scale(4.52)">
    <path d="M40 25 L40 75 L40 90 L10 90 L10 60 L75 60 L90 60 L90 90 L60 90 L60 25 L60 10 L90 10 L90 40 L25 40 L10 40 L10 10 L40 10 Z" fill="none" stroke="#f5f0f1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
