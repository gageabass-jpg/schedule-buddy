# Nucleus protection. PERMANENT. These checks keep Nucleus Manager (desktop/) and the shared
# library (shared-ui/) safe from work on other apps. See docs/nucleus-protection.md.
#
#   isolation-guard     A pull request that changes Wagonwheel may not change desktop/ or shared-ui/.
#   protection-scripts  Unit tests of the checks below, so a broken check cannot pass quietly.
#   shared-ui-checks    Types, lint (Nucleus's own rules) and import boundaries for shared-ui/.
#   css-regression      If shared-ui/ changed: build Nucleus from main and from the change; the CSS must match.
#   nucleus-smoke       Launch the built Nucleus Manager and check its UI comes up.
#
# This file only adds checks. The Firebase Hosting workflow is untouched.
name: Nucleus protection

on:
  pull_request:
    branches: [main]
    # labeled/edited: the guard reads the title and labels, so a change to either re-runs it.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nucleus-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Wagonwheel must not change desktop/ or shared-ui/
        # Title, branch and labels are untrusted text: they go in through env, never into the script line.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/guard-wagonwheel-isolation.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  protection-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install desktop (the shared-ui check borrows its toolchain)
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund
      - name: Test the checks
        run: >
          node --test
          scripts/guard-wagonwheel-isolation.test.mjs
          scripts/compare-nucleus-css.test.mjs
          scripts/check-shared-ui.test.mjs

  shared-ui-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install desktop (the toolchain)
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund
      - name: Types, lint and imports for shared-ui/
        run: node scripts/check-shared-ui.mjs

  detect-shared-ui-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      run_css: ${{ steps.diff.outputs.run_css }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          # shared-ui/ itself, and the files that make the check work: a change to those must be checked too.
          if git diff --name-only "$base" "$HEAD_SHA" | grep -E '^(shared-ui/|scripts/nucleus-css-regression\.mjs|scripts/lib/nucleus-css\.mjs|\.github/workflows/nucleus-protection\.yml)' ; then
            echo "run_css=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_css=false" >> "$GITHUB_OUTPUT"
            echo "shared-ui/ is not touched: the CSS regression check is not needed."
          fi

  css-regression:
    needs: detect-shared-ui-change
    if: needs.detect-shared-ui-change.outputs.run_css == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build Nucleus from main and from this change, and compare the CSS
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # main as this change branched from it, so changes that landed on main since are not blamed on this PR.
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "Comparing the change at $HEAD_SHA with main at $merge_base"
          node scripts/nucleus-css-regression.mjs --base "$merge_base" --head "$HEAD_SHA"

  nucleus-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Display and libraries Electron needs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6
      - name: Install Nucleus Manager
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Download the Electron binary, with retries
        # The release server sometimes answers 504, and the binary is otherwise fetched lazily by
        # the first thing that launches Electron, which would then fail with a confusing message.
        working-directory: desktop
        run: |
          for attempt in 1 2 3 4 5; do
            if node node_modules/electron/install.js && test -f node_modules/electron/path.txt; then
              echo "Electron is installed: $(cat node_modules/electron/path.txt)"
              exit 0
            fi
            echo "Download attempt $attempt failed. Waiting before the next try."
            sleep $((attempt * 15))
          done
          echo "::error::The Electron binary could not be downloaded after 5 attempts."
          exit 1
      - name: Install the smoke test
        working-directory: ci/smoke
        run: npm ci --no-audit --no-fund
      - name: Build Nucleus Manager
        working-directory: desktop
        run: |
          npx tsc -p tsconfig.electron.json
          npx vite build --logLevel warn
      - name: Launch it and check the UI
        run: xvfb-run -a -s "-screen 0 1440x900x24" node ci/smoke/nucleus-smoke.mjs
      - name: Check the smoke test can fail
        run: xvfb-run -a -s "-screen 0 1440x900x24" node --test ci/smoke/nucleus-smoke.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleus-smoke
          path: ci/smoke/artifacts
          if-no-files-found: ignore
