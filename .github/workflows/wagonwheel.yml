# Nucleus Wagonwheel: its own checks. It builds and tests on its own, and never needs Nucleus
# Manager to run. It does compile the shared primitives in shared-ui/, so a change there is
# checked here too.
#
# The `wagonwheel` job is meant to be a REQUIRED status check on main (the "Protect main" ruleset),
# so it must run on EVERY pull request. Do not add a `paths` filter to `pull_request`: GitHub never
# starts a workflow that a path filter skips, and a required check that never starts stays
# "Expected" for ever and blocks the merge. The `push` trigger keeps its filter; nothing requires
# a check on a push.
name: Wagonwheel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["wagonwheel/**", "shared-ui/**", ".github/workflows/wagonwheel.yml"]

permissions:
  contents: read

concurrency:
  group: wagonwheel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wagonwheel:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wagonwheel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Display and libraries Electron needs
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Download the Electron binary, with retries
        # The release server sometimes answers 504. Without this step the binary is fetched lazily
        # by the first test that launches the app, and one timeout there fails every end-to-end
        # test at once.
        run: |
          for attempt in 1 2 3 4 5; do
            if node node_modules/electron/install.js && test -f node_modules/electron/path.txt; then
              echo "Electron is installed: $(cat node_modules/electron/path.txt)"
              exit 0
            fi
            echo "Download attempt $attempt failed. Waiting before the next try."
            sleep $((attempt * 15))
          done
          echo "::error::The Electron binary could not be downloaded after 5 attempts."
          exit 1
      - name: Typecheck (renderer and main process)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (SQLite layer, dates, dashboard maths)
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end tests and the dashboard screenshot
        # Opens the real built app, creates and edits data through its window, restarts it,
        # backs up and restores, and compares the dashboard with e2e/baseline/dashboard.png.
        run: node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wagonwheel-screenshots
          path: wagonwheel/e2e/artifacts
          if-no-files-found: warn
          include-hidden-files: true
