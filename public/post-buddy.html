<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Post Buddy — Package Tracker</title>
<link rel="icon" href="icons/icon-192.png" />
<style>
  /* ─────────────────────────────────────────────────────────────
     Post Buddy — macOS-native package tracker (Find My / Maps light)
     Passive WALL DASHBOARD layout: full-bleed journey map (left) +
     always-on status menu (right). Informative with zero interaction;
     still clickable on a Mac. Dependency-free vanilla so it loads fast
     and offline on the Pi kiosk. Feed it real data by dropping a
     post-buddy-data.json next to this file (see DATA SHAPE below).
     ───────────────────────────────────────────────────────────── */
  :root { --pb-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: var(--pb-font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background: var(--pb-window-bg, #e9e9ec);
    color: var(--pb-text, #1d1d1f);
  }
  #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body.wall { cursor: none; }
  body.wall .pb-tool-settings, body.wall .pb-tool-add, body.wall .pb-rail-filter { display: none !important; }

  @keyframes pbPulse {
    0%   { transform: scale(0.55); opacity: 0.55; }
    70%  { transform: scale(2.6);  opacity: 0; }
    100% { opacity: 0; }
  }
  .pb-pulse { transform-box: fill-box; transform-origin: center; animation: pbPulse 2.2s ease-out infinite; }

  @keyframes pbDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .pb-pulse-dot { animation: pbDot 1.6s ease-in-out infinite; }

  @keyframes pbFlow { to { stroke-dashoffset: -280; } }
  .pb-flow { animation: pbFlow 7s linear infinite; }

  .pb-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .pb-scroll::-webkit-scrollbar-thumb { background: rgba(140,140,150,0.4); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  .pb-scroll::-webkit-scrollbar-track { background: transparent; }

  .pb-card, .pb-tool, .pb-seg-btn, .pb-swatch, .pb-mapbtn { transition: background .15s, box-shadow .15s, transform .12s; }
  .pb-fade-in { animation: pbFadeIn .35s ease; }
  @keyframes pbFadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .pb-pulse, .pb-pulse-dot, .pb-flow, .pb-fade-in { animation: none; }
  }

  /* narrow-window fallback: rail goes full width, map hides */
  @media (max-width: 720px) { .pb-maparea { display: none !important; } .pb-rail { left: 14px !important; width: auto !important; } }

  /* ───────────────────────────────────────────────────────────────
     DATA SHAPE — drop a post-buddy-data.json (array) next to this file,
     or pass ?data=<url>. The wall re-reads it every 60s. Each item:
       {
         "id": "ebay", "title": "eBay Package", "carrier": "USPS",
         "state": "transit" | "out" | "delivered",
         "statusLine": "Preparing for Delivery",
         "statusSub": "Arrived at hub · Charleston, WV",
         "eta": "Mon, Jun 1",            // short, shown on the card
         "fromCity": "Henderson, NV", "toCity": "Charleston, WV",
         "waypoints": [ {"x":168,"y":452,"label":"Henderson, NV","kind":"origin"},
                        {"x":828,"y":356,"label":"Charleston, WV","kind":"current"} ],
         "events": [ {"label":"Arrived at Hub","place":"CHARLESTON, WV","date":"May 31 · 12:42 PM"} ]
       }
     waypoint x/y are in the map's 0–1000 × 0–600 space; kind is one of
     origin | mid | current | delivered. Missing fields get sane defaults.
     ─────────────────────────────────────────────────────────────── */
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
(function () {
  // ── hyperscript helper ──
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "style") Object.assign(e.style, v);
      else if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    const add = (c) => {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    };
    kids.forEach(add);
    return e;
  }
  const FONT = "var(--pb-font)";

  // ── theme tokens (light Find-My / dark), accent tunable ──
  function getTheme(dark, accent) {
    if (dark) {
      return {
        dark: true,
        accent, accentInk: "#fff", accentSoft: accent + "2b",
        windowBg: "#1c1c1e",
        chrome: "rgba(30,30,32,0.72)",
        panel: "#2c2c2e", panelGlass: "rgba(36,36,38,0.72)", panelHover: "rgba(255,255,255,0.06)",
        text: "#f5f5f7", text2: "#a1a1a6", text3: "#7c7c80",
        sep: "rgba(255,255,255,0.10)", sepStrong: "rgba(255,255,255,0.16)",
        land: "#26262a", land2: "#2d2d31", water: "#1a2a3c", park: "#1f3324",
        mapLabel: "rgba(255,255,255,0.55)", mapLabelBg: "rgba(28,28,30,0.7)",
        mapBorder: "rgba(255,255,255,0.07)", labelStroke: "rgba(255,255,255,0.08)",
        pinShadow: "rgba(0,0,0,0.5)", dotStroke: "rgba(0,0,0,0.08)",
        dimRoute: "rgba(255,255,255,0.5)",
        green: "#30d158", blue: "#0a84ff", red: "#ff453a",
        shadowWin: "0 0 0 1px rgba(0,0,0,0.6), 0 24px 70px rgba(0,0,0,0.6)",
        cardShadow: "0 1px 3px rgba(0,0,0,0.4), 0 8px 30px rgba(0,0,0,0.35)",
        glassBorder: "rgba(255,255,255,0.12)",
        segBg: "rgba(255,255,255,0.08)", segOn: "#48484a",
        thumbAlpha: "26", focusBg: "rgba(255,255,255,0.06)",
      };
    }
    return {
      dark: false,
      accent, accentInk: "#fff", accentSoft: accent + "1f",
      windowBg: "#ffffff",
      chrome: "rgba(248,248,250,0.72)",
      panel: "#ffffff", panelGlass: "rgba(255,255,255,0.72)", panelHover: "rgba(0,0,0,0.045)",
      text: "#1d1d1f", text2: "#6e6e73", text3: "#9b9ba1",
      sep: "rgba(0,0,0,0.08)", sepStrong: "rgba(0,0,0,0.13)",
      land: "#f1ede4", land2: "#eae5da", water: "#a9d4f5", park: "#c9e7bd",
      mapLabel: "rgba(60,60,67,0.6)", mapLabelBg: "rgba(255,255,255,0.82)",
      mapBorder: "rgba(0,0,0,0.07)", labelStroke: "rgba(0,0,0,0.05)",
      pinShadow: "rgba(0,0,0,0.28)", dotStroke: "rgba(0,0,0,0.08)",
      dimRoute: "rgba(70,70,75,0.5)",
      green: "#34c759", blue: "#0a84ff", red: "#ff3b30",
      shadowWin: "0 0 0 1px rgba(0,0,0,0.16), 0 24px 70px rgba(0,0,0,0.32)",
      cardShadow: "0 1px 2px rgba(0,0,0,0.06), 0 10px 30px rgba(0,0,0,0.10)",
      glassBorder: "rgba(255,255,255,0.6)",
      segBg: "rgba(0,0,0,0.06)", segOn: "#ffffff",
      thumbAlpha: "18", focusBg: "rgba(0,0,0,0.028)",
    };
  }
  const stateColor = (t, st) => st === "delivered" ? t.green : st === "out" ? t.accent : t.blue;

  // ── seed data (used until a post-buddy-data.json is provided) ──
  const SEED_PACKAGES = [
    {
      id: "ebay", title: "eBay Package", sub: "Vintage camera lens", carrier: "USPS",
      tracking: "9400 1112 0000 8841 2207 45", state: "transit",
      statusLine: "Preparing for Delivery", statusSub: "Arrived at hub · Charleston, WV",
      eta: "Mon, Jun 1", etaLong: "Monday, June 1", progress: 0.9,
      fromCity: "Henderson, NV", toCity: "Charleston, WV",
      waypoints: [
        { x: 168, y: 452, label: "Henderson, NV", kind: "origin" },
        { x: 150, y: 402, label: "Las Vegas, NV", kind: "mid" },
        { x: 620, y: 300, label: "Indianapolis, IN", kind: "mid" },
        { x: 828, y: 356, label: "Charleston, WV", kind: "current" },
      ],
      events: [
        { label: "Preparing for Delivery", place: "", date: "", current: true },
        { label: "Arrived at Hub", place: "CHARLESTON, WV 25301", date: "May 31, 2026 · 12:42 PM" },
        { label: "Departed USPS Facility", place: "CHARLESTON WV PROCESSING CENTER", date: "May 31, 2026 · 6:35 AM" },
        { label: "Arrived at USPS Facility", place: "CHARLESTON WV PROCESSING CENTER", date: "May 30, 2026 · 10:08 AM" },
        { label: "Departed USPS Facility", place: "INDIANAPOLIS IN DISTRIBUTION CENTER", date: "May 30, 2026 · 7:06 AM" },
        { label: "Arrived at USPS Facility", place: "INDIANAPOLIS IN DISTRIBUTION CENTER", date: "May 29, 2026 · 11:23 PM" },
        { label: "Departed USPS Facility", place: "LAS VEGAS NV PACKAGE SORTING CENTER", date: "May 28, 2026 · 3:23 AM" },
        { label: "Arrived at USPS Facility", place: "LAS VEGAS NV PACKAGE SORTING CENTER", date: "May 27, 2026 · 8:55 PM" },
        { label: "USPS in possession of item", place: "HENDERSON, NV 89012", date: "May 27, 2026 · 4:46 PM" },
        { label: "Shipping Label Created", place: "HENDERSON, NV 89002", date: "May 27, 2026 · 2:25 PM" },
      ],
    },
    {
      id: "airpods", title: "AirPods Pro", sub: "Replacement set", carrier: "UPS",
      tracking: "1Z 999 AA1 01 2345 6784", state: "out",
      statusLine: "Out for Delivery", statusSub: "On the delivery vehicle",
      eta: "Today, by 9 PM", etaLong: "Today, by 9 PM", progress: 0.97,
      fromCity: "Columbus, OH", toCity: "Charleston, WV",
      waypoints: [
        { x: 560, y: 250, label: "Columbus, OH", kind: "origin" },
        { x: 720, y: 320, label: "Local Facility", kind: "mid" },
        { x: 824, y: 360, label: "Out for Delivery", kind: "current" },
      ],
      events: [
        { label: "Out for Delivery", place: "CHARLESTON, WV 25301", date: "May 31, 2026 · 7:58 AM", current: true },
        { label: "Arrived at Local Facility", place: "CHARLESTON, WV", date: "May 31, 2026 · 5:12 AM" },
        { label: "Departed Hub", place: "COLUMBUS, OH", date: "May 30, 2026 · 9:40 PM" },
        { label: "Origin Scan", place: "COLUMBUS, OH", date: "May 30, 2026 · 2:15 PM" },
      ],
    },
    {
      id: "shoes", title: "Trail Runners", sub: "Size 10 · Slate", carrier: "FedEx",
      tracking: "7712 0048 9930", state: "delivered",
      statusLine: "Delivered", statusSub: "Left at front door",
      eta: "Delivered Fri", etaLong: "Delivered Fri, May 29", progress: 1,
      fromCity: "Memphis, TN", toCity: "Charleston, WV",
      waypoints: [
        { x: 430, y: 430, label: "Memphis, TN", kind: "origin" },
        { x: 650, y: 360, label: "Knoxville, TN", kind: "mid" },
        { x: 824, y: 358, label: "Charleston, WV", kind: "delivered" },
      ],
      events: [
        { label: "Delivered", place: "Front door · CHARLESTON, WV", date: "May 29, 2026 · 3:09 PM", current: true },
        { label: "Out for Delivery", place: "CHARLESTON, WV", date: "May 29, 2026 · 8:22 AM" },
        { label: "At Local FedEx Facility", place: "CHARLESTON, WV", date: "May 29, 2026 · 6:01 AM" },
        { label: "In Transit", place: "KNOXVILLE, TN", date: "May 28, 2026 · 11:50 PM" },
        { label: "Shipment Picked Up", place: "MEMPHIS, TN", date: "May 27, 2026 · 4:30 PM" },
      ],
    },
  ];

  // ── glyphs ──
  function iconStr(name, size, color, stroke) {
    const a = `fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"`;
    const P = {
      plus: `<path d="M9 3.5V14.5M3.5 9H14.5" ${a}/>`,
      box: `<path d="M9 2.2 15.3 5.6V12.4L9 15.8 2.7 12.4V5.6Z" ${a}/><path d="M2.7 5.6 9 9l6.3-3.4M9 9v6.8" ${a}/>`,
      truck: `<path d="M1.8 5.2h8.4v6.6H1.8z" ${a}/><path d="M10.2 7.2h3l2 2.2v2.4h-5z" ${a}/><circle cx="5" cy="13" r="1.4" ${a}/><circle cx="12.4" cy="13" r="1.4" ${a}/>`,
      check: `<path d="M3.5 9.2 7 12.5 14.5 5" ${a}/>`,
      nav: `<path d="M15 3 3 8.4l5.2 1.7L9.9 15z" ${a}/>`,
      locate: `<circle cx="9" cy="9" r="3.1" ${a}/><path d="M9 1.5v2.4M9 14.1v2.4M16.5 9h-2.4M3.9 9H1.5" ${a}/>`,
      sliders: `<path d="M3 6h6" ${a}/><path d="M13 6h2" ${a}/><circle cx="11" cy="6" r="1.9" ${a}/><path d="M3 12h2" ${a}/><path d="M9 12h6" ${a}/><circle cx="7" cy="12" r="1.9" ${a}/>`,
    };
    return `<svg width="${size}" height="${size}" viewBox="0 0 18 18" style="display:block;flex-shrink:0">${P[name] || ""}</svg>`;
  }
  function icon(name, size, color, stroke) {
    const w = document.createElement("span");
    w.style.display = "inline-flex";
    w.innerHTML = iconStr(name, size || 17, color || "currentColor", stroke || 1.7);
    return w.firstElementChild;
  }

  // ── map building blocks ──
  function routePath(pts) {
    if (pts.length < 2) return "";
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], b = pts[i];
      const mx = (p.x + b.x) / 2, my = (p.y + b.y) / 2;
      const dist = Math.hypot(b.x - p.x, b.y - p.y);
      const lift = Math.min(dist * 0.16, 70);
      d += ` Q ${mx} ${my - lift} ${b.x} ${b.y}`;
    }
    return d;
  }
  const GLYPH = {
    delivered: `<path d="M3.5 9.2 7 12.5 14.5 5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`,
    out: `<path d="M1.8 5.2h8.4v6.6H1.8z" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.2 7.2h3l2 2.2v2.4h-5z" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="13" r="1.3" fill="none" stroke-width="1.8"/><circle cx="12.4" cy="13" r="1.3" fill="none" stroke-width="1.8"/>`,
    transit: `<path d="M9 2.2 15.3 5.6V12.4L9 15.8 2.7 12.4V5.6Z" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.7 5.6 9 9l6.3-3.4M9 9v6.8" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`,
  };
  function pinMarkup(w, pinStyle, t, pkgState) {
    const isMain = w.kind === "current" || w.kind === "delivered";
    if (!isMain) {
      const r = w.kind === "origin" ? 6 : 4.5;
      return `<g>
        <circle r="${r + 3}" fill="#fff" stroke="${t.dotStroke}" stroke-width="1"/>
        <circle r="${r}" fill="${w.kind === "origin" ? t.accent : t.text2}"/>
        ${w.kind === "origin" ? `<circle r="${r - 2.4}" fill="#fff"/>` : ""}
      </g>`;
    }
    const size = 38;
    const color = w.kind === "delivered" ? t.green : t.accent;
    const glyph = GLYPH[w.kind === "delivered" ? "delivered" : pkgState] || GLYPH.transit;
    let body;
    if (pinStyle === "circle") {
      body = `<g>
        <circle r="${size / 2 + 3}" fill="#fff" style="filter:drop-shadow(0 3px 5px ${t.pinShadow})"/>
        <circle r="${size / 2}" fill="${color}"/>
        <g transform="translate(-9,-9)" stroke="#fff">${glyph}</g>
      </g>`;
    } else if (pinStyle === "tag") {
      const W = size + 10, H = size;
      body = `<g>
        <g style="filter:drop-shadow(0 4px 6px ${t.pinShadow})">
          <rect x="${-W / 2}" y="${-H / 2 - 8}" width="${W}" height="${H}" rx="11" fill="#fff"/>
          <rect x="${-W / 2 + 2.5}" y="${-H / 2 - 5.5}" width="${W - 5}" height="${H - 5}" rx="8.5" fill="${color}"/>
          <path d="M ${-6} ${H / 2 - 5} L 0 ${H / 2 + 4} L 6 ${H / 2 - 5} Z" fill="#fff"/>
        </g>
        <g transform="translate(-9,${-9 - 8})" stroke="#fff">${glyph}</g>
      </g>`;
    } else {
      body = `<g>
        <g style="filter:drop-shadow(0 4px 6px ${t.pinShadow})">
          <path d="M0 -34 C 13 -34 21 -25 21 -14 C 21 -2 7 7 0 18 C -7 7 -21 -2 -21 -14 C -21 -25 -13 -34 0 -34 Z" fill="#fff"/>
          <path d="M0 -31 C 11.4 -31 18 -23 18 -14 C 18 -4 6 4 0 13.5 C -6 4 -18 -4 -18 -14 C -18 -23 -11.4 -31 0 -31 Z" fill="${color}"/>
        </g>
        <g transform="translate(-9,-23)" stroke="#fff">${glyph}</g>
      </g>`;
    }
    const pulse = w.kind === "current" ? `<circle class="pb-pulse" r="${size / 2}" fill="${color}" opacity="0.35"/>` : "";
    return `<g>${pulse}${body}</g>`;
  }
  function mapLabelMarkup(text, t, strong) {
    const w = Math.max(40, text.length * 6.6 + 16);
    return `<g>
      <rect x="${-w / 2}" y="-11" width="${w}" height="22" rx="7" fill="${t.mapLabelBg}" stroke="${t.labelStroke}" stroke-width="1" style="filter:${strong ? "drop-shadow(0 2px 4px rgba(0,0,0,0.15))" : "none"}"/>
      <text x="0" y="4.5" text-anchor="middle" font-family="${FONT}" font-size="${strong ? 12.5 : 11.5}" font-weight="${strong ? 700 : 600}" fill="${t.text}">${text}</text>
    </g>`;
  }
  function baseMapInner(t) {
    const ctx = [
      { x: 300, y: 250, n: "Denver" }, { x: 470, y: 200, n: "Chicago" },
      { x: 760, y: 230, n: "Pittsburgh" }, { x: 540, y: 430, n: "Nashville" },
      { x: 250, y: 360, n: "Phoenix" }, { x: 880, y: 250, n: "D.C." },
    ];
    return `
      <path d="M -40 90 C 120 60 300 70 470 60 C 640 50 820 70 1040 60 L 1040 470 C 980 520 900 470 820 500 C 700 545 560 500 430 540 C 300 580 160 540 60 560 C -10 575 -40 520 -40 470 Z" fill="${t.land}"/>
      <g opacity="${t.dark ? 0.5 : 0.7}">
        <path d="M -40 90 C 120 70 260 80 380 120 C 420 240 360 360 300 440 C 180 470 40 470 -40 460 Z" fill="${t.land2}"/>
        <path d="M 700 70 C 820 80 960 70 1040 70 L 1040 320 C 940 340 820 300 740 320 C 690 230 700 150 700 70 Z" fill="${t.land2}"/>
      </g>
      <g stroke="${t.mapBorder}" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M 300 60 C 290 200 320 360 300 470"/>
        <path d="M 470 55 C 480 200 460 360 470 545"/>
        <path d="M 640 55 C 650 200 630 360 640 510"/>
        <path d="M 800 65 C 810 200 790 360 800 500"/>
        <path d="M -40 250 C 200 240 600 260 1040 245"/>
        <path d="M -40 380 C 300 370 700 400 1040 380"/>
      </g>
      <path d="M 455 150 C 510 140 540 175 520 205 C 480 225 430 205 440 175 Z" fill="${t.water}" opacity="0.9"/>
      <path d="M 520 205 C 560 250 540 320 600 360" stroke="${t.water}" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
      <ellipse cx="360" cy="300" rx="34" ry="22" fill="${t.park}" opacity="0.75"/>
      <ellipse cx="690" cy="420" rx="28" ry="18" fill="${t.park}" opacity="0.75"/>
      ${ctx.map((c) => `<g><circle cx="${c.x}" cy="${c.y}" r="2.6" fill="${t.text3}" opacity="0.7"/><text x="${c.x + 7}" y="${c.y + 3.5}" font-family="${FONT}" font-size="12" fill="${t.mapLabel}" font-weight="500">${c.n}</text></g>`).join("")}`;
  }
  // All journeys at once: every active route start→finish, the focused one
  // emphasised (glow + flow + pins + labels), the rest drawn dim.
  function mapSvg(t, pinStyle, packages, focusId) {
    const focus = packages.find((p) => p.id === focusId) || packages[0];
    const others = packages.filter((p) => p.id !== focus.id && p.state !== "delivered");
    const dim = others.map((p) => {
      const rp = routePath(p.waypoints);
      const cur = p.waypoints[p.waypoints.length - 1];
      const c = stateColor(t, p.state);
      return `<g opacity="0.6">
        <path d="${rp}" fill="none" stroke="${t.dimRoute}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 7"/>
        <circle cx="${cur.x}" cy="${cur.y}" r="7" fill="#fff" stroke="${t.dotStroke}" stroke-width="1"/>
        <circle cx="${cur.x}" cy="${cur.y}" r="4.2" fill="${c}"/>
      </g>`;
    }).join("");

    const fp = focus.waypoints;
    const frp = routePath(fp);
    const focusColor = focus.state === "delivered" ? t.green : t.accent;
    const glow = fp.filter((w) => w.kind === "current" || w.kind === "delivered")
      .map((w) => `<circle cx="${w.x}" cy="${w.y}" r="46" fill="url(#glow-foc)"/>`).join("");
    const labels = fp.map((w) => {
      const main = w.kind === "current" || w.kind === "delivered";
      const above = w.y > 120;
      const ly = main ? (above ? w.y - 50 : w.y + 30) : w.y + (w.kind === "origin" ? 20 : 16);
      return `<g transform="translate(${w.x}, ${ly})">${mapLabelMarkup(w.label, t, main)}</g>`;
    }).join("");
    const pins = fp.map((w) => `<g transform="translate(${w.x}, ${w.y})">${pinMarkup(w, pinStyle, t, focus.state)}</g>`).join("");

    return `<svg viewBox="70 140 880 410" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;background:${t.water}">

      h("div", { style: { display: "flex", flexDirection: "column", lineHeight: "1.1", marginLeft: "2px" } },
        h("span", { style: { fontSize: "15px", fontWeight: "700" } }, "Post Buddy"),
        h("span", { style: { fontSize: "11px", color: t.text2 } }, inTransit + " in transit · " + pkgs.length + " tracked")),
      h("div", { style: { flex: "1" } }),
      h("div", { id: "pb-clock", style: { fontSize: "13px", fontWeight: "600", color: t.text2, fontVariantNumeric: "tabular-nums" } }, formatClock()),
      settingsBtn,
      toolButton({ icon: "plus", primary: true, cls: "pb-tool-add", onClick: openAddSheet }));

    // map area (everything left of the rail)
    const mapHost = h("div", { style: { position: "absolute", inset: "0" } });
    mapHost.innerHTML = mapSvg(t, state.settings.pin, list.length ? list : pkgs, focus.id);
    state.refs.mapHost = mapHost;
    const mapArea = h("div", {
      class: "pb-maparea",
      style: { position: "absolute", left: "0", top: "0", bottom: "0", right: (RAIL_W + RAIL_GAP * 2) + "px", background: t.water, overflow: "hidden" },
    },
      mapHost,
      h("div", { style: { position: "absolute", left: "16px", top: "16px", zIndex: "4" } }, livePill()),
      mapControls());

    // right status menu
    const railBody = h("div", { class: "pb-scroll", style: { flex: "1", overflowY: "auto", padding: "4px 8px 10px" } });
    if (!list.length) railBody.appendChild(h("div", { style: { padding: "28px", textAlign: "center", fontSize: "12.5px", color: t.text3 } }, "No packages"));
    else list.forEach((p, i) => {
      if (i) railBody.appendChild(h("div", { style: { height: "1px", background: t.sep, margin: "2px 12px" } }));
      railBody.appendChild(statusCard(p, p.id === focus.id));
    });
    const rail = glass({ position: "absolute", right: RAIL_GAP + "px", top: RAIL_GAP + "px", bottom: RAIL_GAP + "px", width: RAIL_W + "px", display: "flex", flexDirection: "column", overflow: "hidden" },
      h("div", { style: { padding: "14px 16px 11px", display: "flex", alignItems: "baseline", justifyContent: "space-between" } },
        h("div", { style: { fontSize: "16px", fontWeight: "700", color: t.text, letterSpacing: "-0.01em" } }, "Deliveries"),
        h("span", { style: { fontSize: "12px", color: t.text2 } }, list.length + (list.length === 1 ? " package" : " packages"))),
      h("div", { class: "pb-rail-filter", style: { padding: "0 12px 11px" } }, segmented({ options: FILTERS, value: state.filter, onChange: (v) => { state.filter = v; render(); } })),
      h("div", { style: { height: "1px", background: t.sep } }),
      railBody);

    const stage = h("div", { style: { flex: "1", position: "relative", overflow: "hidden" } }, mapArea, rail);
    app.appendChild(toolbar);
    app.appendChild(stage);
  }

  // ── kiosk: hide cursor + rotate which package the map emphasises ──
  function setupKiosk() {
    const q = new URLSearchParams(location.search);
    const wall = q.get("wall") === "1" || q.get("wall") === "true";
    if (wall) document.body.classList.add("wall");
    const cycleParam = q.get("cycle");
    if (!(wall || cycleParam != null)) return;
    const secs = Math.max(4, parseInt(cycleParam, 10) || 9);
    document.addEventListener("pointerdown", () => { cyclePausedUntil = Date.now() + 30000; });
    setInterval(() => {
      if (Date.now() < cyclePausedUntil) return;
      if (document.getElementById("pb-settings") || document.querySelector(".pb-fade-in input")) return;
      const list = visiblePackages();
      if (list.length < 2) return;
      const idx = list.findIndex((p) => p.id === state.selId);
      state.selId = list[(idx + 1) % list.length].id;
      render();
    }, secs * 1000);
  }

  function startClock() {
    setInterval(() => { const c = document.getElementById("pb-clock"); if (c) c.textContent = formatClock(); }, 15000);
  }

  // ── init ──
  (async function init() {
    const data = await loadData();
    if (data) state.packages = data;
    // Default the map's emphasis to the most urgent package (out for delivery → in transit).
    const top = visiblePackages()[0];
    if (top) state.selId = top.id;
    render();
    setupKiosk();
    startClock();
    startDataRefresh();
  })();
})();
</script>
</body>
</html>
